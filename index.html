<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Customer Lookup Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f4f6f9;
      color: #1e293b;
      margin: 0;
      padding: 30px 15px;
    }
    .app-card {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      padding: 32px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header h2 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
    }
    .status-badge {
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
    }
    .status-badge.loading { background-color: #e0f2fe; color: #0284c7; }
    .status-badge.ready { background-color: #dcfce7; color: #166534; }
    .status-badge.error { background-color: #fee2e2; color: #991b1b; }

    .search-wrapper {
      position: relative;
      margin-bottom: 28px;
    }
    .search-input {
      width: 100%;
      padding: 16px 20px;
      font-size: 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      outline: none;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .search-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    .details-container {
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Financial Metrics Cards */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .metric-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 16px;
      border-radius: 12px;
    }
    .metric-card.highlight {
      background: #fef2f2;
      border-color: #fecaca;
    }
    .metric-card.success {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }
    .metric-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 6px;
    }
    .metric-value {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
    }
    .metric-card.highlight .metric-value { color: #dc2626; }
    .metric-card.success .metric-value { color: #16a34a; }

    /* Info Grid */
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 16px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 8px;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }
    @media (max-width: 600px) {
      .info-grid { grid-template-columns: 1fr; }
    }
    .info-item {
      display: flex;
      flex-direction: column;
    }
    .info-label {
      font-size: 13px;
      font-weight: 500;
      color: #64748b;
      margin-bottom: 4px;
    }
    .info-val {
      font-size: 15px;
      font-weight: 600;
      color: #1e293b;
    }
    .dpd-badge {
      display: inline-block;
      padding: 2px 8px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      width: fit-content;
    }

    /* Remark Box */
    .remark-box {
      margin-top: 24px;
    }
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      resize: vertical;
      transition: border-color 0.2s;
    }
    textarea:focus {
      border-color: #2563eb;
    }
    .submit-btn {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .submit-btn:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

<div class="app-card">
  <div class="header">
    <h2>Loan Customer Lookup</h2>
    <div id="appStatus" class="status-badge loading">Loading database...</div>
  </div>

  <div class="search-wrapper">
    <input type="text" id="searchInput" class="search-input" placeholder="Type Loan No or Mobile Number..." oninput="instantSearch()" disabled>
  </div>

  <div id="detailsCard" class="details-container">
    
    <!-- Top Summary Cards -->
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-title">Loan Amount</div>
        <div class="metric-value" id="dispLoanAmt">₹0</div>
      </div>
      <div class="metric-card success">
        <div class="metric-title">Part Collected</div>
        <div class="metric-value" id="dispPartCollection">₹0</div>
      </div>
      <div class="metric-card highlight">
        <div class="metric-title">Pending Amount</div>
        <div class="metric-value" id="dispPendingAmt">₹0</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Repay Amount</div>
        <div class="metric-value" id="dispRepayAmt">₹0</div>
      </div>
    </div>

    <!-- Customer Details -->
    <div class="section-title">Customer Details</div>
    <div class="info-grid">
      <div class="info-item">
        <span class="info-label">Customer Name</span>
        <span class="info-val" id="dispName">-</span>
      </div>
      <div class="info-item">
        <span class="info-label">Loan No</span>
        <span class="info-val" id="dispLoanNo">-</span>
      </div>
      <div class="info-item">
        <span class="info-label">Mobile Number</span>
        <span class="info-val" id="dispMobile">-</span>
      </div>
      <div class="info-item">
        <span class="info-label">Email ID</span>
        <span class="info-val" id="dispEmail">-</span>
      </div>
      <div class="info-item">
        <span class="info-label">Settlement Amount</span>
        <span class="info-val" id="dispSettlementAmt">-</span>
      </div>
      <div class="info-item">
        <span class="info-label">Disburse Date</span>
        <span class="info-val" id="dispDisburseDate">-</span>
      </div>
      <div class="info-item">
        <span class="info-label">Last Payment Date</span>
        <span class="info-val" id="dispLastPaymentDate">-</span>
      </div>
      <div class="info-item">
        <span class="info-label">DPD</span>
        <span class="info-val"><span class="dpd-badge" id="dispDpd">0</span></span>
      </div>
    </div>

    <!-- Agent Remark Box -->
    <div class="remark-box">
      <div class="section-title">Agent Remark</div>
      <textarea id="remarkInput" rows="3" placeholder="Enter updated remark here..."></textarea>
      <button class="submit-btn" onclick="submitRemark()">Submit Remark</button>
    </div>

  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyKJi6jIzH8iluxNf4ojFpcyQBPmaRXw8xJJx-7L_tZTFVsgWoAJEittBaiNeeK4ZJLKw/exec"; 
  
  let allRecords = [];
  let currentRecord = null;

  window.addEventListener('DOMContentLoaded', async () => {
    const statusBox = document.getElementById("appStatus");
    const searchInput = document.getElementById("searchInput");

    try {
      const response = await fetch(SCRIPT_URL);
      const result = await response.json();

      if (result.status === "success") {
        allRecords = result.data;
        statusBox.className = "status-badge ready";
        statusBox.innerText = `Ready! ${allRecords.length} records loaded.`;
        searchInput.disabled = false;
        searchInput.focus();
      } else {
        throw new Error("Failed to load");
      }
    } catch (err) {
      statusBox.className = "status-badge error";
      statusBox.innerText = "Error loading data";
    }
  });

  function instantSearch() {
    const query = document.getElementById("searchInput").value.trim().toLowerCase();
    const detailsCard = document.getElementById("detailsCard");

    if (!query) {
      detailsCard.style.display = "none";
      currentRecord = null;
      return;
    }

    const match = allRecords.find(item => 
      item.loanNo.toLowerCase() === query || 
      item.mobile.toLowerCase() === query
    );

    if (match) {
      currentRecord = match;
      document.getElementById("dispLoanNo").innerText = match.loanNo;
      document.getElementById("dispName").innerText = match.customerName;
      document.getElementById("dispLoanAmt").innerText = match.loanAmount ? "₹" + match.loanAmount : "-";
      document.getElementById("dispPartCollection").innerText = match.partCollection ? "₹" + match.partCollection : "₹0";
      document.getElementById("dispPendingAmt").innerText = match.pendingAmount ? "₹" + match.pendingAmount : "₹0";
      document.getElementById("dispRepayAmt").innerText = match.repayAmount ? "₹" + match.repayAmount : "-";
      document.getElementById("dispSettlementAmt").innerText = match.settlementAmount ? "₹" + match.settlementAmount : "-";
      document.getElementById("dispDisburseDate").innerText = match.disburseDate || "-";
      document.getElementById("dispLastPaymentDate").innerText = match.lastPaymentDate || "-";
      document.getElementById("dispDpd").innerText = match.dpd;
      document.getElementById("dispEmail").innerText = match.email;
      document.getElementById("dispMobile").innerText = match.mobile;
      document.getElementById("remarkInput").value = match.remark || "";

      detailsCard.style.display = "block";
    } else {
      detailsCard.style.display = "none";
      currentRecord = null;
    }
  }

  async function submitRemark() {
    if (!currentRecord) return;

    const newRemark = document.getElementById("remarkInput").value.trim();
    const statusBox = document.getElementById("appStatus");

    statusBox.className = "status-badge loading";
    statusBox.innerText = "Saving remark...";

    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          rowIndex: currentRecord.rowIndex,
          remark: newRemark
        })
      });
      const result = await response.json();

      if (result.status === "success") {
        currentRecord.remark = newRemark;
        statusBox.className = "status-badge ready";
        statusBox.innerText = "Remark saved successfully!";
      } else {
        throw new Error("Save failed");
      }
    } catch (err) {
      statusBox.className = "status-badge error";
      statusBox.innerText = "Failed to save remark";
    }
  }
</script>

</body>
</html>
